name: Broken Link Checker

# Validates all internal and external links in the built site (site/dist)
# to ensure no dead links ship to production.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/link-check.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/link-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  link-check:
    name: Check Links in Built Site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linkinator (fast link checker)
        run: npm install -g linkinator@5

      - name: Check all links in site/dist
        run: |
          if [ ! -d "site/dist" ]; then
            echo "site/dist not found, skipping link check"
            exit 0
          fi
          echo "Checking links in site/dist..."
          linkinator "site/dist" \
            --recurse \
            --concurrency 10 \
            --skip "mailto:*,*tel:*,*whatsapp:*,*.pdf" \
            --format json > link-report.json || true
          
          # Parse and output broken links as GitHub Actions annotations
          node -e '
          const fs = require("fs");
          try {
            const report = JSON.parse(fs.readFileSync("link-report.json", "utf8"));
            let brokenCount = 0;
            report.links.forEach(link => {
              if (link.status >= 400 || link.error) {
                brokenCount++;
                const msg = link.error || `HTTP ${link.status}`;
                console.log(`::warning file=${link.url}::Broken link: ${link.url} -> ${link.parent} (${msg})`);
              }
            });
            if (brokenCount > 0) {
              console.log(`::notice::Found ${brokenCount} broken links. See annotations for details.`);
            } else {
              console.log("No broken links found!");
            }
          } catch (e) {
            console.log("Could not parse link report");
          }
          '